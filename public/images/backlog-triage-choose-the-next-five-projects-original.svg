<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Select five. Start within real capacity.</title><desc id="desc">Original backlog funnel showing incoming requests narrowed to five ordered cards, with one card in a separately labeled active lane; five is a planning example, not a performance guarantee.</desc><rect width="1200" height="780" fill="#f6f7f3"/><g font-family="Arial, sans-serif"><text x="55" y="82" font-size="34" fill="#20394a">Select five. Start within real capacity.</text><text x="57" y="129" font-size="20" fill="#20394a">ResultsBreakthrough • Original editorial illustration</text><rect x="87" y="204" width="105" height="46" rx="10" fill="#b4c4d6"/><rect x="217" y="204" width="105" height="46" rx="10" fill="#d8c897"/><rect x="347" y="204" width="105" height="46" rx="10" fill="#a8c6b5"/><path d="M85 282 H453 L331 462 V510 H208 V462 Z" fill="#dbe5ec"/><text x="136" y="340" font-size="29" fill="#20394a">GOAL</text><text x="130" y="385" font-size="29" fill="#20394a">EVIDENCE</text><text x="101" y="561" font-size="27" fill="#20394a">Order the candidates</text><rect x="549" y="208" width="201" height="59" rx="10" fill="#fff"/><text x="572" y="247" font-size="30" fill="#20394a">1</text><path d="M621 237 H720" fill="none" stroke="#9aabae" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="549" y="288" width="201" height="59" rx="10" fill="#fff"/><text x="572" y="327" font-size="30" fill="#20394a">2</text><path d="M621 317 H720" fill="none" stroke="#9aabae" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="549" y="368" width="201" height="59" rx="10" fill="#fff"/><text x="572" y="407" font-size="30" fill="#20394a">3</text><path d="M621 397 H720" fill="none" stroke="#9aabae" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="549" y="448" width="201" height="59" rx="10" fill="#fff"/><text x="572" y="487" font-size="30" fill="#20394a">4</text><path d="M621 477 H720" fill="none" stroke="#9aabae" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="549" y="528" width="201" height="59" rx="10" fill="#fff"/><text x="572" y="567" font-size="30" fill="#20394a">5</text><path d="M621 557 H720" fill="none" stroke="#9aabae" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="870" y="296" width="242" height="220" rx="10" fill="#d7e9e1"/><text x="904" y="339" font-size="27" fill="#20394a">ACTIVE</text><rect x="919" y="373" width="145" height="84" rx="10" fill="#518770"/><text x="979" y="428" font-size="40" fill="#fff">1</text><path d="M771 237 H807 V410 H851 M835 394 L852 410 L835 426" fill="none" stroke="#518770" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="183" y="705" font-size="28" fill="#20394a">Queued work is not a promise to start everything.</text></g></svg>
