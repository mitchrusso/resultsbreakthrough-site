<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Fifteen minutes, one clear commitment</title><desc id="desc">Original clock-like agenda divided into five-minute evidence, obstacle, and next-action sectors, next to a short written commitment card.</desc><rect width="1200" height="780" fill="#f6f7f3"/><g font-family="Arial, sans-serif"><text x="55" y="82" font-size="34" fill="#20394a">Fifteen minutes, one clear commitment</text><text x="57" y="129" font-size="20" fill="#20394a">ResultsBreakthrough • Original editorial illustration</text><circle cx="363" cy="409" r="190" fill="#fff"/><path d="M363 409 L363 219 A190 190 0 0 1 528 504 Z" fill="#aac4df"/><path d="M363 409 L528 504 A190 190 0 0 1 198 504 Z" fill="#e8ce87"/><path d="M363 409 L198 504 A190 190 0 0 1 363 219 Z" fill="#a8caba"/><circle cx="363" cy="409" r="98" fill="#fff"/><text x="328" y="407" font-size="64" fill="#20394a">15</text><text x="315" y="448" font-size="23" fill="#20394a">minutes</text><text x="291" y="192" font-size="24" fill="#20394a">EVIDENCE</text><text x="95" y="588" font-size="24" fill="#20394a">NEXT ACTION</text><text x="480" y="588" font-size="24" fill="#20394a">OBSTACLE</text><rect x="748" y="249" width="354" height="322" rx="10" fill="#fff"/><text x="778" y="301" font-size="27" fill="#20394a">WRITE IT DOWN</text><text x="778" y="363" font-size="27" fill="#20394a">Action</text><path d="M779 386 H1062" fill="none" stroke="#9aabb2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="778" y="433" font-size="27" fill="#20394a">Time + evidence</text><path d="M779 463 H1062" fill="none" stroke="#9aabb2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="778" y="525" font-size="24" fill="#20394a">Read back together</text><text x="136" y="680" font-size="28" fill="#20394a">An example agenda to test, not a guaranteed formula.</text></g></svg>
