<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Weekly review scorecard</title><desc id="desc">A two-line chart comparing leading actions and lagging results across four weeks.</desc><rect width="1200" height="760" fill="#f1f5fb"/><text x="75" y="95" font-family="Arial" font-size="28" font-weight="700" fill="#3562a5">RESULTS BREAKTHROUGH FIELD NOTE</text><text x="75" y="165" font-family="Arial" font-size="51" font-weight="800" fill="#17253d">Weekly Review: Actions Before Outcomes</text><text x="75" y="215" font-family="Arial" font-size="24" fill="#52617a">Track what you can do this week and what the business reports later.</text><g stroke="#c8d2e1" stroke-width="2"><path d="M140 300h900M140 390h900M140 480h900M140 570h900"/><path d="M230 270v340M480 270v340M730 270v340M980 270v340"/></g><polyline points="230,510 480,425 730,350 980,305" fill="none" stroke="#2b75c9" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><polyline points="230,555 480,520 730,455 980,385" fill="none" stroke="#d08324" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><g font-family="Arial" font-size="22" font-weight="700" fill="#17253d" text-anchor="middle"><text x="230" y="650">WEEK 1</text><text x="480" y="650">WEEK 2</text><text x="730" y="650">WEEK 3</text><text x="980" y="650">WEEK 4</text></g><rect x="760" y="90" width="22" height="22" rx="4" fill="#2b75c9"/><text x="795" y="109" font-family="Arial" font-size="20" fill="#17253d">Leading actions</text><rect x="970" y="90" width="22" height="22" rx="4" fill="#d08324"/><text x="1005" y="109" font-family="Arial" font-size="20" fill="#17253d">Lagging results</text></svg>
