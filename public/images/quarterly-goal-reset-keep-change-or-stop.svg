<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Quarterly Goal Reset: Keep, Change, or Stop decision map</title><desc id="d">Six-step original decision map for Goal Systems: verify, inspect, compare, test, record, and decide.</desc><rect width="1200" height="760" fill="#EEF2FF"/><rect width="1200" height="28" fill="#4F46E5"/><text x="70" y="85" fill="#4F46E5" font-size="22" font-weight="700" letter-spacing="3">RESULTSBREAKTHROUGH</text><text x="70" y="150" fill="#172554" font-size="48" font-weight="700">Quarterly Goal Reset: Keep, Change, or</text><text x="70" y="212" fill="#172554" font-size="48" font-weight="700">Stop</text><g transform="translate(65 360)"><rect width="330" height="125" rx="18" fill="white" stroke="#4F46E5" stroke-width="3"/><circle cx="42" cy="40" r="24" fill="#4F46E5"/><text x="42" y="48" text-anchor="middle" fill="white" font-size="22" font-weight="700">1</text><text x="80" y="47" fill="#172554" font-size="22" font-weight="700">VERIFY</text><text x="32" y="88" fill="#172554" font-size="17">Goal Systems</text></g><g transform="translate(450 360)"><rect width="330" height="125" rx="18" fill="white" stroke="#4F46E5" stroke-width="3"/><circle cx="42" cy="40" r="24" fill="#4F46E5"/><text x="42" y="48" text-anchor="middle" fill="white" font-size="22" font-weight="700">2</text><text x="80" y="47" fill="#172554" font-size="22" font-weight="700">INSPECT</text><text x="32" y="88" fill="#172554" font-size="17">Goal Systems</text></g><g transform="translate(835 360)"><rect width="330" height="125" rx="18" fill="white" stroke="#4F46E5" stroke-width="3"/><circle cx="42" cy="40" r="24" fill="#4F46E5"/><text x="42" y="48" text-anchor="middle" fill="white" font-size="22" font-weight="700">3</text><text x="80" y="47" fill="#172554" font-size="22" font-weight="700">COMPARE</text><text x="32" y="88" fill="#172554" font-size="17">Goal Systems</text></g><g transform="translate(65