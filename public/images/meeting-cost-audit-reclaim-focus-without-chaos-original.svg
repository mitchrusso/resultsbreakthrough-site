<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Count the work around the meeting</title><desc id="desc">Original meeting audit visualization showing eight participant markers around a 45-minute clock, with preparation adding two person-hours.</desc><rect width="1200" height="760" fill="#f6f7f3"/><g font-family="Arial, sans-serif"><text x="65" y="95" font-size="36" fill="#20394a">Count the work around the meeting</text><text x="67" y="144" font-size="20" fill="#20394a">ResultsBreakthrough • Original editorial illustration</text><circle cx="336" cy="363" r="119" fill="#fff"/><path d="M336 288 V363 L401 405" fill="none" stroke="#243b6b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><circle cx="336" cy="195" r="24" fill="#5477a4"/><circle cx="461" cy="245" r="24" fill="#5477a4"/><circle cx="507" cy="363" r="24" fill="#5477a4"/><circle cx="461" cy="486" r="24" fill="#5477a4"/><circle cx="336" cy="532" r="24" fill="#5477a4"/><circle cx="211" cy="486" r="24" fill="#5477a4"/><circle cx="165" cy="363" r="24" fill="#5477a4"/><circle cx="211" cy="245" r="24" fill="#5477a4"/><text x="225" y="595" font-size="28" fill="#20394a">8 people × 45 minutes</text><text x="752" y="280" font-size="40" fill="#20394a">6 person-hours</text><text x="752" y="339" font-size="29" fill="#20394a">+ 2 preparation hours</text><path d="M739 375 H1082" fill="none" stroke="#d7a93e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="757" y="447" font-size="40" fill="#20394a">8 hours total</text><text x="754" y="509" font-size="24" fill="#20394a">Illustrative time estimate</text><path d="M530 363 H694 M668 340 L696 363 L668 386" fill="none" stroke="#243b6b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="166" y="674" font-size="29" fill="#20394a">Compare decisions and rework as well as calendar time.</text></g></svg>
